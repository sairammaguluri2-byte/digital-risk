    const BrandBackgroundCanvas = () => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          if (!canvas) return;
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        // Smooth mouse parallax coordinates
        let mouseX = width / 2;
        let mouseY = height / 2;
        let targetMouseX = width / 2;
        let targetMouseY = height / 2;

        const handleMouseMove = (e) => {
          targetMouseX = e.clientX;
          targetMouseY = e.clientY;
        };
        window.addEventListener('mousemove', handleMouseMove);

        // 55 Golden cyber defense network nodes
        const nodeCount = 55;
        const nodes = [];
        for (let i = 0; i < nodeCount; i++) {
          nodes.push({
            x: Math.random() * width,
            y: Math.random() * height,
            vx: (Math.random() - 0.5) * 0.45,
            vy: (Math.random() - 0.5) * 0.45,
            radius: Math.random() * 1.6 + 0.8,
            baseAlpha: Math.random() * 0.4 + 0.25,
            pulseSpeed: Math.random() * 0.02 + 0.01,
            phase: Math.random() * Math.PI * 2
          });

        // Preload brand logo for middle background advertisement

        let radarAngle = 0;

        const render = () => {
          // Smooth parallax damping
          mouseX += (targetMouseX - mouseX) * 0.05;
          mouseY += (targetMouseY - mouseY) * 0.05;
          const parallaxX = (mouseX - width / 2) * 0.04;
          const parallaxY = (mouseY - height / 2) * 0.04;

          // Clear with pure obsidian background
          ctx.fillStyle = '#050608';
          ctx.fillRect(0, 0, width, height);

          const cx = width / 2 + parallaxX;
          const cy = height / 2 + parallaxY;
          const maxDim = Math.max(width, height);

          // 1. Ambient luxury radial gold warmth in middle background
          const ambientGlow = ctx.createRadialGradient(cx, cy, 30, cx, cy, maxDim * 0.65);
          ambientGlow.addColorStop(0, 'rgba(197, 160, 89, 0.22)');
          ambientGlow.addColorStop(0.35, 'rgba(197, 160, 89, 0.08)');
          ambientGlow.addColorStop(0.75, 'rgba(5, 6, 8, 0)');
          ctx.fillStyle = ambientGlow;
          ctx.fillRect(0, 0, width, height);

          // 2. Official Brand Advertisement / Insignia in Middle Background
          pulsePhase += 0.025;
          if (logoLoaded) {
            ctx.save();
            ctx.translate(cx, cy);
            const logoBreath = Math.sin(pulsePhase * 0.7) * 0.1;
            ctx.globalAlpha = 0.52 + logoBreath;
            const logoW = Math.min(width, height) * 0.34;
            const logoH = logoW * (logoImg.height / logoImg.width || 0.85);
            ctx.shadowColor = '#C5A059';
            ctx.shadowBlur = 28;
            ctx.drawImage(logoImg, -logoW / 2, -logoH / 2, logoW, logoH);
            ctx.restore();
          }

          // 3. Slow tactical radar scan beam
          radarAngle += 0.008;
          ctx.save();
          ctx.translate(cx, cy);
          ctx.rotate(radarAngle);
          const sweepGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, 400);
          sweepGrad.addColorStop(0, 'rgba(230, 202, 133, 0.22)');
          sweepGrad.addColorStop(0.4, 'rgba(197, 160, 89, 0.06)');
          sweepGrad.addColorStop(1, 'rgba(197, 160, 89, 0)');
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, 400, 0, Math.PI / 2.8);
          ctx.closePath();
          ctx.fillStyle = sweepGrad;
          ctx.fill();
          ctx.restore();

          // 4. Central Glowing Brand Shield Wireframe & Defensive Perimeter
          rotationAngle += 0.0018;
          const shieldRadius = Math.min(width, height) * 0.24;
          const breathing = Math.sin(pulsePhase) * 5;
          const curRadius = shieldRadius + breathing;

          ctx.save();
          ctx.translate(cx, cy);

          // Outer calibrated compass / radar ring
          ctx.strokeStyle = 'rgba(197, 160, 89, 0.45)';
          ctx.lineWidth = 1.2;
          ctx.setLineDash([4, 8]);
          ctx.beginPath();
          ctx.arc(0, 0, curRadius * 1.48, 0, Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);

          // Cardinal degree markers on outer ring
          const ticks = 36;
          for (let i = 0; i < ticks; i++) {
            const a = (i * Math.PI * 2) / ticks;
            const rInner = curRadius * 1.44;
            const rOuter = i % 9 === 0 ? curRadius * 1.55 : curRadius * 1.48;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * rInner, Math.sin(a) * rInner);
            ctx.lineTo(Math.cos(a) * rOuter, Math.sin(a) * rOuter);
            ctx.strokeStyle = i % 9 === 0 ? 'rgba(230, 202, 133, 0.9)' : 'rgba(197, 160, 89, 0.45)';
            ctx.lineWidth = i % 9 === 0 ? 1.5 : 1;
            ctx.stroke();
          }

          // Orbiting sentinel satellites
          const sat1Angle = -rotationAngle * 2.4;
          const sat2Angle = rotationAngle * 1.8 + Math.PI;
          const sat3Angle = -rotationAngle * 1.2 + Math.PI / 2;

          const drawSatellite = (angle, dist, r, glow) => {
            const sx = Math.cos(angle) * dist;
            const sy = Math.sin(angle) * dist;
            ctx.beginPath();
            ctx.arc(sx, sy, r, 0, Math.PI * 2);
            ctx.fillStyle = '#E6CA85';
            ctx.shadowColor = '#C5A059';
            ctx.shadowBlur = glow;
            ctx.fill();
            ctx.shadowBlur = 0;
          };
          drawSatellite(sat1Angle, curRadius * 1.48, 3.0, 12);
          drawSatellite(sat2Angle, curRadius * 1.26, 2.2, 8);
          drawSatellite(sat3Angle, curRadius * 1.68, 2.0, 6);

          // Subtle gentle oscillation for the shield wireframe
          ctx.rotate(Math.sin(rotationAngle * 0.8) * 0.08);

          const drawShieldPath = (r) => {
            ctx.beginPath();
            ctx.moveTo(0, -r);
            ctx.lineTo(r * 0.78, -r * 0.65);
            ctx.lineTo(r * 0.78, r * 0.15);
            ctx.quadraticCurveTo(r * 0.7, r * 0.6, 0, r * 0.95);
            ctx.quadraticCurveTo(-r * 0.7, r * 0.6, -r * 0.78, r * 0.15);
            ctx.lineTo(-r * 0.78, -r * 0.65);
            ctx.closePath();
          };

          // Outer shield outline with rich gold glow
          drawShieldPath(curRadius);
          ctx.strokeStyle = 'rgba(230, 202, 133, 0.85)';
          ctx.lineWidth = 1.8;
          ctx.shadowColor = '#C5A059';
          ctx.shadowBlur = 18;
          ctx.stroke();
          ctx.shadowBlur = 0;

          // Inner shield outline
          drawShieldPath(curRadius * 0.72);
          ctx.strokeStyle = 'rgba(230, 202, 133, 0.45)';
          ctx.lineWidth = 1.2;
          ctx.stroke();

          // Inner monogram / faceted structural lines
          ctx.beginPath();
          ctx.moveTo(0, -curRadius);
          ctx.lineTo(0, curRadius * 0.95);
          ctx.moveTo(-curRadius * 0.78, -curRadius * 0.65);
          ctx.lineTo(curRadius * 0.78, curRadius * 0.15);
          ctx.moveTo(curRadius * 0.78, -curRadius * 0.65);
          ctx.lineTo(-curRadius * 0.78, curRadius * 0.15);
          ctx.strokeStyle = 'rgba(197, 160, 89, 0.35)';
          ctx.lineWidth = 1;
          ctx.stroke();

          ctx.restore();

          // 4. Digital Risk Constellation (nodes & proximity defense lines)
          for (let i = 0; i < nodes.length; i++) {
            const p = nodes[i];
            p.x += p.vx;
            p.y += p.vy;

            // Screen wrap-around
            if (p.x < 0) p.x = width;
            if (p.x > width) p.x = 0;
            if (p.y < 0) p.y = height;
            if (p.y > height) p.y = 0;

            p.phase += p.pulseSpeed;
            const currentAlpha = p.baseAlpha + Math.sin(p.phase) * 0.15;

            // Draw node
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(230, 202, 133, ${Math.max(0.1, currentAlpha)})`;
            ctx.fill();

            // Connect nearby nodes
            for (let j = i + 1; j < nodes.length; j++) {
              const p2 = nodes[j];
              const dx = p.x - p2.x;
              const dy = p.y - p2.y;
              const dist = Math.sqrt(dx * dx + dy * dy);

              if (dist < 115) {
                const lineAlpha = (1 - dist / 115) * 0.22;
                ctx.beginPath();
                ctx.moveTo(p.x, p.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = `rgba(197, 160, 89, ${lineAlpha})`;
                ctx.lineWidth = 0.75;
                ctx.stroke();
              }
            }
          }

          animId = requestAnimationFrame(render);
        };

        render();

        return () => {
          cancelAnimationFrame(animId);
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
        };
      }, []);

              {/* SECTION 5: CLIENT REVIEWS (SCALED FOR MOBILE) */}
              {activeTab === 'reviews' && (
                <div className="space-y-4 sm:space-y-6 max-w-5xl mx-auto">
                  
                  {/* Back Button */}
                  <div className="flex items-center justify-between pb-2 border-b border-surface-border">

                    </p>
                  </div>

                  {/* 3 Real Testimonial Cards */}
                  <div className={`grid ${isMobileLayout ? 'grid-cols-1 gap-3' : 'grid-cols-1 md:grid-cols-3 gap-6'}`}>

                      <div key={i} className={`bg-surface panel-border ${isMobileLayout ? 'p-4 space-y-3' : 'p-6 space-y-4'} rounded-lg flex flex-col justify-between`}>
                        <p className={`${isMobileLayout ? 'text-[11px]' : 'text-xs'} text-text-secondary leading-relaxed italic`}>
                          "{t.quote}"

                        <div className="flex items-center space-x-2.5 pt-3 border-t border-surface-border">

                            src={t.photo} 
                            alt={t.name}

                            <p className="text-[10px] text-text-secondary">{t.role}</p>

                          </div>

                  {/* One Action Button */}

                    <button
                      onClick={navigateBackToFeed}

                      <span>Return to Live Monitoring</span>

            </main>

            {/* INCIDENT DETAIL MODAL */}
            {selectedIncident && (
              <div onClick={(e) => { if (e.target === e.currentTarget) setSelectedIncident(null); }} className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-3 sm:p-5 overflow-y-auto">
                <div className="bg-surface panel-border max-w-2xl w-full rounded-xl shadow-2xl p-6 sm:p-8 space-y-5 max-h-[92vh] overflow-y-auto border border-gold/40">
                  
                  <div className="flex items-center justify-between pb-3 border-b border-surface-border">
                    <button
                      onClick={() => setSelectedIncident(null)}
                      className="text-xs text-gold hover:underline font-semibold flex items-center space-x-1 cursor-pointer"

                      <IconArrowLeft className="w-4 h-4" />
                      <span>Back to Feed</span>
                    </button>
                    <button onClick={() => setSelectedIncident(null)} className="text-text-secondary hover:text-white cursor-pointer">
                      <IconX className="w-5 h-5" />
                    </button>
                  </div>

                  <div className="flex items-center space-x-4">
                    <img src={selectedIncident.realPhoto} alt={selectedIncident.assetName} className="w-16 h-16 rounded object-cover border border-surface-border flex-shrink-0" />
                    <div className="min-w-0 flex-1">
                      <div className="flex items-center space-x-2">
                        <span className="text-xs font-bold text-gold uppercase">{selectedIncident.id}</span>
                        <span className="text-[10px] font-semibold px-2 py-0.5 rounded bg-risk-critical/20 text-red-400">
                          Risk {selectedIncident.riskScore}/100

                      </div>
                      <h3 className="text-lg font-serif font-bold text-white truncate">{selectedIncident.assetName}</h3>
                      <p className="text-xs text-text-secondary">{selectedIncident.platform} • {selectedIncident.detectionType}</p>
                    </div>
                  </div>

                  <div className="p-3.5 bg-canvas border border-surface-border rounded space-y-1.5">
                    <span className="text-xs uppercase text-gold font-semibold block">Incident Summary</span>
                    <p className="text-xs text-text-secondary leading-relaxed">{selectedIncident.evidence.plainExplanation}</p>
                  </div>

                  {/* Explainable AI Risk Factor Weights (Weights + Impact Breakdown) */}
                  <div className="space-y-2">
                    <span className="text-xs uppercase text-gold font-semibold block">Explainable AI Risk Breakdown (Signals & Weights)</span>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 text-xs">
                      <div className="p-3 bg-canvas border border-surface-border rounded space-y-1">
                        <div className="flex items-center justify-between text-[11px]">
                          <span className="text-white font-semibold">Vector Logo Distance</span>
                          <span className="text-gold font-mono font-bold">Weight: 35% (+33 pts)</span>
                        </div>
                        <p className="text-[11px] text-text-secondary">
                          Visual similarity: <span className="text-white font-bold">{selectedIncident.evidence.logoSimilarity}%</span> match against registered trademark vectors.
                        </p>
                      </div>

                      <div className="p-3 bg-canvas border border-surface-border rounded space-y-1">
                        <div className="flex items-center justify-between text-[11px]">
                          <span className="text-white font-semibold">Account Velocity & Age</span>
                          <span className="text-gold font-mono font-bold">Weight: 25% (+24 pts)</span>
                        </div>
                        <p className="text-[11px] text-text-secondary">
                          Active age: <span className="text-white font-bold">{selectedIncident.evidence.accountAgeDays} Days</span>. High-velocity account creation anomaly.
                        </p>
                      </div>

                      <div className="p-3 bg-canvas border border-surface-border rounded space-y-1">
                        <div className="flex items-center justify-between text-[11px]">
                          <span className="text-white font-semibold">Follower Ratio Anomaly</span>
                          <span className="text-gold font-mono font-bold">Weight: 20% (+18 pts)</span>
                        </div>
                        <p className="text-[11px] text-text-secondary">
                          Profile metrics: <span className="text-white font-bold">{selectedIncident.evidence.followerRatio}</span>. Typical bot signature.
                        </p>
                      </div>

                      <div className="p-3 bg-canvas border border-surface-border rounded space-y-1">
                        <div className="flex items-center justify-between text-[11px]">
                          <span className="text-white font-semibold">Deceptive Lexical Triggers</span>
                          <span className="text-gold font-mono font-bold">Weight: 20% (+17 pts)</span>
                        </div>
                        <p className="text-[11px] text-text-secondary truncate">
                          Keywords: <span className="text-white font-bold">{selectedIncident.evidence.flaggedStrings.join(", ")}</span>.
                        </p>
                      </div>
                    </div>
                  </div>

                  {/* Recommended Response Actions Grid */}
                  <div className="p-3.5 bg-canvas border border-surface-border rounded space-y-2">
                    <div className="flex items-center justify-between">
                      <span className="text-xs uppercase text-gold font-semibold">Recommended Response Actions</span>
                      <span className="text-[10px] text-emerald-400 font-mono">Status: {selectedIncident.status}</span>
                    </div>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-[11px]">
                      <div className="p-2 rounded bg-surface border border-surface-border text-center">
                        <span className="text-gold font-bold block">1. Abuse Report</span>
                        <span className="text-[10px] text-text-secondary">Platform API</span>
                      </div>
                      <div className="p-2 rounded bg-surface border border-surface-border text-center">
                        <span className="text-gold font-bold block">2. DMCA Demand</span>
                        <span className="text-[10px] text-text-secondary">Legal Notice</span>
                      </div>
                      <div className="p-2 rounded bg-surface border border-surface-border text-center">
                        <span className="text-gold font-bold block">3. IOC Telemetry</span>
                        <span className="text-[10px] text-text-secondary">Surveillance</span>
                      </div>
                      <div className="p-2 rounded bg-surface border border-surface-border text-center">
                        <span className="text-gold font-bold block">4. Injunction</span>
                        <span className="text-[10px] text-text-secondary">Legal Counsel</span>
                      </div>
                    </div>
                  </div>

                  {/* Quick Triage Buttons */}
                  <div className="flex items-center flex-wrap gap-2 pt-1 border-t border-surface-border">
                    <span className="text-[10px] uppercase text-text-secondary font-semibold">Update Status:</span>
                    <button
                      onClick={() => updateIncidentStatus(selectedIncident.id, "Confirmed Threat")}
                      className="px-2.5 py-1 rounded bg-risk-critical/20 text-red-300 hover:bg-risk-critical/30 border border-risk-critical/40 text-xs font-semibold cursor-pointer"
                    >
                      Confirm Threat

                    <button
                      onClick={() => updateIncidentStatus(selectedIncident.id, "False Positive")}
                      className="px-2.5 py-1 rounded bg-surface hover:bg-surface-raised border border-surface-border text-text-secondary hover:text-white text-xs font-semibold cursor-pointer"
                    >
                      False Positive
                    </button>
                    <button
                      onClick={() => updateIncidentStatus(selectedIncident.id, "Resolved")}
                      className="px-2.5 py-1 rounded bg-risk-low/20 text-emerald-300 hover:bg-risk-low/30 border border-risk-low/40 text-xs font-semibold cursor-pointer"
                    >
                      Resolved
                    </button>
                  </div>

                  {/* Primary Action Button */}
                  <button
                    onClick={() => {
                      updateIncidentStatus(selectedIncident.id, "Under Takedown");
                      handleGenerateTakedown(selectedIncident);

                    className="w-full px-6 py-2.5 rounded bg-gold hover:bg-gold-light text-black font-sans font-semibold text-xs tracking-wider uppercase transition-all shadow-sm flex items-center justify-center space-x-2 cursor-pointer"
                  >
                    <IconFileText className="w-4 h-4 text-black" />
                    <span>Issue Formal Statutory Takedown Demand</span>
                  </button>

                </div>
              </div>
            )}

            {/* AUTONOMOUS AI ACTION EXECUTION MODAL */}
            {aiActionModal && (
              <div onClick={(e) => { if (e.target === e.currentTarget && aiActionModal.completed) setAiActionModal(null); }} className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4 backdrop-blur-sm">
                <div className="bg-surface panel-border max-w-lg w-full rounded-lg shadow-2xl p-6 space-y-4 border border-gold/50">
                  <div className="flex items-center justify-between pb-3 border-b border-surface-border">
                    <div className="flex items-center space-x-2">
                      <IconZap className="w-5 h-5 text-gold" />
                      <span className="text-sm font-serif font-bold text-white uppercase">AI Autonomous Remediation</span>
                    </div>
                    {aiActionModal.completed && (
                      <button onClick={() => setAiActionModal(null)} className="text-text-secondary hover:text-white cursor-pointer">
                        <IconX className="w-5 h-5" />
                      </button>
                    )}
                  </div>

                  <div className="p-3 bg-canvas border border-surface-border rounded-lg space-y-1 text-xs">
                    <div className="flex items-center justify-between">
                      <span className="font-semibold text-white">{aiActionModal.incident.assetName}</span>
                      <span className="text-gold font-mono">{aiActionModal.incident.platform}</span>
                    </div>
                    <p className="text-text-secondary text-[11px]">{aiActionModal.rec.action}</p>
                  </div>

                  {/* Step Execution Terminal */}
                  <div className="bg-black/90 p-3.5 rounded border border-surface-border font-mono text-[11px] space-y-2">
                    <div className="flex items-center space-x-2 text-text-secondary">
                      <span className="text-gold">Docket Reference:</span>
                      <span className="text-white font-bold">#{aiActionModal.docketId}</span>
                    </div>

                    <div className="space-y-1.5 pt-1">
                      <div className={`flex items-center space-x-2 ${aiActionModal.step >= 1 ? 'text-white' : 'text-text-secondary/50'}`}>
                        {aiActionModal.step > 1 ? (
                          <IconCheck className="w-3.5 h-3.5 text-emerald-400" />
                        ) : (
                          <span className="w-3.5 h-3.5 rounded-full border border-gold animate-spin block"></span>
                        )}
                        <span>Phase 1: Extracting SHA-256 asset hash & WHOIS telemetry</span>
                      </div>

                      <div className={`flex items-center space-x-2 ${aiActionModal.step >= 2 ? 'text-white' : 'text-text-secondary/50'}`}>
                        {aiActionModal.step > 2 ? (
                          <IconCheck className="w-3.5 h-3.5 text-emerald-400" />
                        ) : aiActionModal.step === 2 ? (
                          <span className="w-3.5 h-3.5 rounded-full border border-gold animate-spin block"></span>
                        ) : (
                          <span className="w-3.5 h-3.5 rounded-full border border-surface-border block"></span>
                        )}
                        <span>Phase 2: Compiling Statutory DMCA § 512(c)(3) legal demand</span>
                      </div>

                      <div className={`flex items-center space-x-2 ${aiActionModal.step >= 3 ? 'text-white' : 'text-text-secondary/50'}`}>
                        {aiActionModal.step > 3 ? (
                          <IconCheck className="w-3.5 h-3.5 text-emerald-400" />
                        ) : aiActionModal.step === 3 ? (
                          <span className="w-3.5 h-3.5 rounded-full border border-gold animate-spin block"></span>
                        ) : (
                          <span className="w-3.5 h-3.5 rounded-full border border-surface-border block"></span>
                        )}
                        <span>Phase 3: Transmitting webhook to {aiActionModal.incident.platform} Abuse Desk</span>
                      </div>

                      <div className={`flex items-center space-x-2 ${aiActionModal.step >= 4 ? 'text-emerald-400 font-bold' : 'text-text-secondary/50'}`}>
                        {aiActionModal.step >= 4 ? (
                          <IconCheck className="w-3.5 h-3.5 text-emerald-400" />
                        ) : (
                          <span className="w-3.5 h-3.5 rounded-full border border-surface-border block"></span>
                        )}
                        <span>Phase 4: Status updated to 'Under Takedown' - Telemetry Active</span>
                      </div>
                    </div>
                  </div>

                  {aiActionModal.completed ? (
                    <div className="flex items-center space-x-3 pt-2">
                      <button
                        onClick={() => {
                          const inc = aiActionModal.incident;
                          setAiActionModal(null);
                          handleGenerateTakedown(inc);
                        }}
                        className="flex-1 py-2 px-3 rounded bg-surface hover:bg-surface-raised border border-gold/40 text-gold font-semibold text-xs transition-colors flex items-center justify-center space-x-1.5 cursor-pointer"
                      >
                        <IconFileText className="w-3.5 h-3.5 text-gold" />
                        <span>View Generated Notice</span>
                      </button>
                      <button
                        onClick={() => setAiActionModal(null)}
                        className="flex-1 py-2 px-3 rounded bg-gold hover:bg-gold-light text-black font-semibold text-xs uppercase tracking-wider transition-colors cursor-pointer"
                      >
                        Done & Return
                      </button>
                    </div>
                  ) : (
                    <div className="text-center py-2 text-xs text-text-secondary">
                      <span className="inline-block animate-pulse text-gold font-semibold">Autonomous AI Agent Dispathing Payload...</span>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* BATCH AUTONOMOUS AI TRIAGE MODAL */}
            {aiBatchModal && (
              <div className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4 backdrop-blur-sm">
                <div className="bg-surface panel-border max-w-md w-full rounded-lg shadow-2xl p-6 space-y-4 border border-gold/50">
                  <div className="flex items-center space-x-2 pb-3 border-b border-surface-border">
                    <IconZap className="w-5 h-5 text-gold" />
                    <span className="text-sm font-serif font-bold text-white uppercase">Batch Autonomous AI Triage</span>
                  </div>

                  <p className="text-xs text-text-secondary leading-relaxed">
                    The autonomous AI agent is processing all ingested threat vectors, correlating signal weights, and dispatching automated statutory takedowns.
                  </p>

                  <div className="space-y-2 py-2">
                    <div className="flex justify-between text-xs font-mono">
                      <span className="text-white">Processing Telemetry...</span>
                      <span className="text-gold font-bold">{aiBatchModal.completed ? '100%' : aiBatchModal.step === 2 ? '65%' : '25%'}</span>
                    </div>
                    <div className="w-full bg-canvas h-2 rounded-full overflow-hidden border border-surface-border">
                      <div 
                        className="bg-gold h-full rounded-full transition-all duration-500" 
                        style={{ width: aiBatchModal.completed ? '100%' : aiBatchModal.step === 2 ? '65%' : '25%' }}
                      ></div>
                    </div>
                  </div>

                  {aiBatchModal.completed ? (
                    <div className="space-y-3 pt-2">
                      <div className="p-3 bg-emerald-500/10 border border-emerald-500/30 rounded text-xs text-emerald-300">

                      </div>
                      <button
                        onClick={() => setAiBatchModal(null)}
                        className="w-full py-2 rounded bg-gold hover:bg-gold-light text-black font-semibold text-xs uppercase tracking-wider cursor-pointer"

                        Return to Triage Queue
                      </button>
                    </div>
                  ) : (
                    <div className="text-center text-xs text-text-secondary font-mono animate-pulse">
                      Analyzing multi-modal neural weights & synthesizing DMCA notices...
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* AI COPILOT INSIGHT MODAL */}
            {aiCopilotModal && (
              <div onClick={(e) => { if (e.target === e.currentTarget) setAiCopilotModal(null); }} className="fixed inset-0 z-50 bg-black/85 flex items-center justify-center p-4 backdrop-blur-sm">
                <div className="bg-surface panel-border max-w-lg w-full rounded-lg shadow-2xl p-6 space-y-4 border border-gold/40">
                  <div className="flex items-center justify-between pb-3 border-b border-surface-border">
                    <div className="flex items-center space-x-2">
                      <IconCpu className="w-4 h-4 text-gold" />
                      <span className="text-xs font-mono font-bold text-gold uppercase">{aiCopilotModal.category}</span>
                    </div>
                    <button onClick={() => setAiCopilotModal(null)} className="text-text-secondary hover:text-white cursor-pointer">
                      <IconX className="w-5 h-5" />
                    </button>
                  </div>

                  <h3 className="text-sm font-serif font-bold text-white">{aiCopilotModal.title}</h3>
                  <div className="p-3.5 bg-canvas border border-surface-border rounded-lg text-xs text-text-secondary leading-relaxed whitespace-pre-line font-sans">
                    {aiCopilotModal.answer}
                  </div>

                  <div className="flex items-center justify-end space-x-3 pt-2">
                    <button
                      onClick={() => {
                        navigator.clipboard.writeText(aiCopilotModal.answer);
                        showToast("Copilot response copied to clipboard");
                      }}
                      className="px-3 py-1.5 rounded bg-surface hover:bg-surface-raised border border-surface-border text-xs text-gold font-semibold cursor-pointer"

                      Copy Response
                    </button>
                    <button
                      onClick={() => setAiCopilotModal(null)}
                      className="px-4 py-1.5 rounded bg-gold hover:bg-gold-light text-black font-semibold text-xs cursor-pointer"
                    >
                      Close
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* TAKEDOWN EXPORT MODAL */}
            {showTakedownModal && (
              <div onClick={(e) => { if (e.target === e.currentTarget) setShowTakedownModal(false); }} className="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
                <div className="bg-surface panel-border max-w-xl w-full rounded-lg shadow-2xl p-6 space-y-4">
                  
                  <div className="flex items-center justify-between pb-3 border-b border-surface-border">
                    <span className="text-xs font-serif font-bold text-white uppercase">Formal Infringement Notice</span>
                    <button onClick={() => setShowTakedownModal(false)} className="text-text-secondary hover:text-white">
                      <IconX className="w-5 h-5" />
                    </button>
                  </div>

                  <textarea
                    readOnly
                    value={takedownContent}
                    rows={10}
                    className="w-full bg-canvas text-text-secondary text-xs p-3 rounded border border-surface-border font-mono resize-none leading-relaxed"
                  />

                  {/* One Action Button */}
                  <button
                    onClick={() => {
                      navigator.clipboard.writeText(takedownContent);
                      showToast("Notice text copied to clipboard");
                    }}
                    className="w-full px-6 py-2.5 rounded bg-gold hover:bg-gold-light text-black font-sans font-semibold text-xs tracking-wider uppercase transition-all shadow-sm flex items-center justify-center space-x-2"
                  >
                    <IconCopy className="w-4 h-4 text-black" />
                    <span>Copy Takedown Notice</span>
                  </button>

                </div>
              </div>
            )}

            {/* JUDGE DEMO SCRIPT & PITCH PACK MODAL */}
            <PitchPackModal 
              isOpen={showPitchModal} 
              onClose={() => setShowPitchModal(false)} 
            />

            {/* FOOTER */}
            <footer className="border-t border-surface-border bg-surface py-6 mt-8">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-text-secondary">
                <div className="flex items-center space-x-3">
                  <img src="./doppelguard-logo.jpg" alt="DoppelGuard" className="h-7 w-auto rounded object-contain border border-gold/30" />
                  <div>
                    <span className="font-serif font-bold text-white block">DOPPELGUARD DIGITAL RISK PROTECTION</span>
                    <span className="text-[10px] text-gold font-sans block">Built by Fantastic Five for Hackathon Prototype</span>
                  </div>
                </div>
                <div className="flex flex-col sm:flex-row sm:items-center sm:space-x-6 text-[11px] text-right sm:text-left gap-1">
                  <span className="text-text-secondary">All threat telemetry simulated for live evaluation</span>
                  <span className="text-emerald-400 font-semibold flex items-center justify-end sm:justify-start space-x-1.5">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    <span>SOC Engine: Active</span>
                  </span>
                </div>
              </div>
            </footer>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
